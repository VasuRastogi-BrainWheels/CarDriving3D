<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Siger Map Compiler</title>
    <style>
        body { font-family: sans-serif; background: #1e1e1e; color: #fff; padding: 20px; }
        h2 { color: #4CAF50; }
        .container { max-width: 800px; margin: auto; background: #2d2d2d; padding: 20px; border-radius: 8px; }
        input, button { margin: 10px 0; padding: 10px; font-size: 16px; }
        button { background: #4CAF50; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #45a049; }
        textarea { width: 100%; height: 300px; background: #1e1e1e; color: #00ffcc; font-family: monospace; padding: 10px; border-radius: 4px; border: 1px solid #444; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Siger 1x1 Map Compiler</h2>
    <p>Upload your MS Paint map image (Red = Building, Green = Tree, White = Road):</p>
    <input type="file" id="imageInput" accept="image/*"><br>
    <canvas id="canvas"></canvas>
    <button id="downloadBtn" disabled>Download Compiled .txt</button>
    <h3>Output Preview:</h3>
    <textarea id="output" readonly placeholder="Compiled data will appear here..."></textarea>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const outputArea = document.getElementById('output');
    const downloadBtn = document.getElementById('downloadBtn');

    let compiledText = '';

    imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                compileMap(img.width, img.height);
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);
    });

    function compileMap(width, height) {
        const imgData = ctx.getImageData(0, 0, width, height);
        const data = imgData.data;

        function getPixel(x, y) {
            if (x < 0 || x >= width || y < 0 || y >= height) return null;
            const idx = (y * width + x) * 4;
            return { r: data[idx], g: data[idx+1], b: data[idx+2] };
        }

        function isWhite(c) { return c && c.r > 200 && c.g > 200 && c.b > 200; }
        function isRed(c)   { return c && c.r > 200 && c.g < 50 && c.b < 50; }
        function isGreen(c) { return c && c.r < 50 && c.g > 200 && c.b < 50; }
        function isBlack(c) { return c && c.r < 20 && c.g < 20 && c.b < 20; }
        let results = [];

        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                const c = getPixel(x, y);
                if (!c) continue;

                if (isWhite(c)) {
                    // Road: check immediate neighbors North > East > South > West
                    let n = isWhite(getPixel(x, y - 1)) ? 'A' : 'O';
                    let e = isWhite(getPixel(x + 1, y)) ? 'A' : 'O';
                    let s = isWhite(getPixel(x, y + 1)) ? 'A' : 'O';
                    let w = isWhite(getPixel(x - 1, y)) ? 'A' : 'O';
                    let roadTile = n + e + s + w;

                    results.push(`["road", 0, "${roadTile}", ${x}, ${y}]`);
                } 
                else if (isRed(c) || isGreen(c)|| isBlack(c)) {
                    let entityName = isRed(c) ? "building" : "tree";
                    if (isBlack(c)) entityName="Billboard"
                    // Check second tile away in order: North (0°), East (90°), South (180°), West (270°)
                    let angleY = 0;
                    let roadTile = "OOOO";

                    if (isWhite(getPixel(x, y - 2))) {
                        angleY = 0;     // North
                    } else if (isWhite(getPixel(x + 2, y))) {
                        angleY = 90;    // East
                    } else if (isWhite(getPixel(x, y + 2))) {
                        angleY = 180;   // South
                    } else if (isWhite(getPixel(x - 2, y))) {
                        angleY = 270;   // West
                    }

                    results.push(`["${entityName}", ${angleY}, "${roadTile}", ${x}, ${y}]`);
                }
            }
        }

        compiledText = results.join("\n");
        outputArea.value = compiledText;
        downloadBtn.disabled = false;
    }

    downloadBtn.addEventListener('click', () => {
        if (!compiledText) return;
        const blob = new Blob([compiledText], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'map_compiled.txt';
        a.click();
        URL.revokeObjectURL(url);
    });
</script>

</body>
</html>
